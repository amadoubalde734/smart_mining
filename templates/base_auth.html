{% load static %}
<!doctype html>
<html lang="en" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="sm-hover" data-sidebar-image="none" data-preloader="disable">

<head>
    <meta charset="utf-8" />
    <title>{% block title %} SmartMining {% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
    <meta content="Themesbrand" name="author" />
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'backend/assets/images/favicon.ico' %}">

    <!-- CSS Libraries -->
    <link href="{% static 'backend/assets/libs/jsvectormap/jsvectormap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'backend/assets/libs/swiper/swiper-bundle.min.css' %}" rel="stylesheet" type="text/css" />
    
    <!-- Bootstrap & App CSS -->
    <link href="{% static 'backend/assets/css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'backend/assets/css/icons.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'backend/assets/css/app.min.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'backend/assets/css/custom.min.css' %}" rel="stylesheet" type="text/css" />


    <!-- Layout Config JS -->
    <script src="{% static 'backend/assets/js/layout.js' %}"></script>
</head>

<body>
    <!-- Begin page -->
    <div id="layout-wrapper">

        <!-- Main Content -->
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
  </div>
</body>
</html>
