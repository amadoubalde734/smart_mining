<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
$(document).ready(function () {
    // Suppression avec SweetAlert
    $('button[id^="btn-delete-"]').on('click', function () {
        var societeId = $(this).attr('id').split('-')[2];
        var form = $('#delete-form-' + societeId);

        Swal.fire({
            title: 'Êtes-vous sûr ?',
            text: "Cette action est irréversible.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Oui, supprimer',
            cancelButtonText: 'Annuler',
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit();
            }
        });
    });

    // Messages Django avec SweetAlert
    {% if messages %}
      {% for message in messages %}
        Swal.fire({
            icon: "{{ message.tags }}",
            title: "{{ message }}",
            timer: 2500,
            showConfirmButton: false
        });
      {% endfor %}
    {% endif %}
});
</script>

<script>
$(document).ready(function () {
    // Ouverture modal modifier et pré-remplissage
    $('.btn-modifier').on('click', function() {
        var id = $(this).data('id');
        var libelle = $(this).data('libelle');
        var date_integration = $(this).data('date');
        var actif = $(this).data('actif');

        $('#libelle_mod').val(libelle);
        $('#date_integration_mod').val(date_integration);
        $('#actif_mod').prop('checked', actif);

        $('#modifierSocieteForm').attr('action', '/parametrage/societes/modifier/' + id + '/');
        $('#modifierSocieteModal').modal('show');
    });

    // Suppression avec SweetAlert
    $('.btn-delete').on('click', function() {
        var id = $(this).data('id');
        var form = $('#delete-form-' + id);

        Swal.fire({
            title: 'Êtes-vous sûr ?',
            text: "Cette action est irréversible.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Oui, supprimer',
            cancelButtonText: 'Annuler',
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit();
            }
        });
    });

    // Messages Django avec SweetAlert
    {% if messages %}
      {% for message in messages %}
        Swal.fire({
            icon: "{{ message.tags }}",
            title: "{{ message }}",
            timer: 2500,
            showConfirmButton: false
        });
      {% endfor %}
    {% endif %}
});
</script>

<script>
$(document).ready(function() {

    // Ouvrir modal modifier et remplir le formulaire
    $('.btn-modifier').click(function() {
        var id = $(this).data('id');
        $('#modifierVilleForm').attr('action', '/parametrage/villes/modifier/' + id + '/');
        $('#libelle_mod').val($(this).data('libelle'));
        $('#pays_mod').val($(this).data('pays'));
        $('#actif_mod').prop('checked', $(this).data('actif'));
        var modal = new bootstrap.Modal(document.getElementById('modifierVilleModal'));
        modal.show();
    });

    // Supprimer avec SweetAlert
    $('.btn-delete').click(function() {
        var villeId = $(this).data('id');
        var form = $('#delete-form-' + villeId);
        Swal.fire({
            title: 'Êtes-vous sûr ?',
            text: "Cette action est irréversible.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Oui, supprimer',
            cancelButtonText: 'Annuler',
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit();
            }
        });
    });

});
</script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    // Boutons Modifier
    const modifierButtons = document.querySelectorAll('.btn-modifier');
    const modal = new bootstrap.Modal(document.getElementById('modifierSiteModal'));
    
    modifierButtons.forEach(button => {
        button.addEventListener('click', function () {
            const siteId = this.getAttribute('data-id');
            const nomSite = this.getAttribute('data-nom');
            const adresse = this.getAttribute('data-adresse');
            const actif = this.getAttribute('data-actif') === 'True';

            document.getElementById('nom_site_mod').value = nomSite;
            document.getElementById('adresse_mod').value = adresse;
            document.getElementById('actif_mod').checked = actif;

            const form = document.getElementById('modifierSiteForm');
            form.action = `/parametrage/sites/modifier/${siteId}/`; // ✅ Correct

            modal.show();
        });
    });

    // Boutons Supprimer
    const deleteButtons = document.querySelectorAll('.btn-delete');
    deleteButtons.forEach(button => {
        button.addEventListener('click', function () {
            const siteId = this.getAttribute('data-id');
            const form = document.getElementById('delete-form-' + siteId);
            if (confirm('Voulez-vous vraiment supprimer ce site ?')) {
                form.submit();
            }
        });
    });
});
</script>
